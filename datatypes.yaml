- name: course information
  hosts: local
  connection: local 
  vars:
    course: "AIOps with devsecops on aws"     #string
    duration_hrs: 150  #number int
    is_live_session: true #bolean
    topics:  #list
    - linux
    - shell
    - ansible
    - terraform
    more_details:    #dict/map
      trainer: pradeep
      months: 5
    exact_duration_months: 4.5  
  tasks:
  - name : print info and type
    debug:
      msg: |
        course: "{{course}} : {{course | type_debug}}"
        duraton: "{{duration_hrs}} : {duration_hrs | type_debug}}"
        is_live_session: "{{is_live_session}} : {{is_live_session | type_debug}}"
        topics are : "{{topics}} : {{topics | type_debug}}"
        more_details : "{{more_details}} : {{more_details | type_debug}}"