- name: print facts
  hosts: local
  connection: local
  tasks:
  - name: print the facts
    debug:
      msg: "{{ansible_facts}}"
  - name: printing sime information from facts 
    debug: 
      msg: |
        osfamily: {{ ansible_facts['os_family'] }}
        privateip: {{ansible_facts.default_ipv4.address}}
        privateip: {{ ansible_facts['default_ipv4']['address'] }}
        
