- name: demo on filters
  hosts: local
  connection: local

  vars:
    topics: linux, shell, ansible, docker, terraform

    names:
      - pradeep
      - kondaboina
      - yadav
    topic: ANSIBLE
  tasks:
  - name: print the name
    debug:
      msg: "HI,{{person_name | default('pradeep')}}"
  - name: convert string to list
    debug:
      msg: "{{ topics | split(',') | map('trim') | list }}"
  - name: convert  list to string
    debug:
      msg: full name: {{ names | join(' ') }}
  - name: convert to lower case
    debug:
      msg: " {{ topic | lower }}"
      