- name: installing packages
  hosts: local
  connection: local
  become: yes
  vars:
    packages:
    - { name: 'nginx', state: 'absent' } # for removal of package
    - { name: 'mysql', state: 'present'} # for adding packages
    - { name: 'git', state: 'present'}
    - { name: 'httpd', state: 'present'}
    - { name: 'net-tools', state: 'absent'}
    - { name: 'htop', state: 'present'}
  tasks:
    - name: installing packages
      package:
        name: "{{item.name}}"
        state: "{{item.state}}"
      loop: "{{packages}}"